<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday My Beautiful Wife ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#120208,#4a0d26,#120208);
color:white;
text-align:center;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
}

h1{
font-size:60px;
animation:glow 2s infinite alternate;
}

@keyframes glow{

from{
text-shadow:0 0 10px pink;
}

to{
text-shadow:0 0 40px pink;
}

}

h2{
margin-top:20px;
font-size:30px;
}

p{
margin-top:20px;
font-size:20px;
line-height:1.8;
}

.button{

margin-top:30px;
padding:15px 35px;
border-radius:40px;
background:white;
color:black;
text-decoration:none;
font-size:18px;

}

.photo{

width:90%;
max-width:500px;
border-radius:25px;
margin:40px auto;
display:block;

}

.falling{

position:fixed;
top:-50px;
font-size:30px;
animation:fall linear infinite;

}

@keyframes fall{

0%{
transform:translateY(-100px) rotate(0deg);
}

100%{
transform:translateY(120vh) rotate(360deg);
}

}

</style>

</head>

<body>

<div class="hero">

<h1>🎂 Happy Birthday 🎂</h1>

<h2>Anvi Arya (Ladooo) ❤️</h2>

<p>

My Queen 👑

<br>

My Love ❤️

<br>

My Everything 💖

</p>

<a href="#gallery" class="button">

🌹 Open Our Love Story 🌹

</a>

</div>

<div id="gallery">

<img src="queenanvi.jpg" class="photo">

<img src="beautifulsmile.jpg" class="photo">

<img src="loveforever.jpg" class="photo">

</div>
<section style="padding:60px 20px;">

<h2>💌 A Letter For You 💌</h2>

<p id="letter" style="max-width:700px;margin:auto;font-size:22px;line-height:2;">
</p>

<button onclick="showMessage()"
style="
padding:15px 30px;
margin-top:30px;
border:none;
border-radius:40px;
font-size:18px;
cursor:pointer;
">
🎁 Open Surprise 🎁
</button>

<div id="surprise"
style="
display:none;
margin-top:30px;
font-size:28px;
">
💍 I Love You Forever ❤️
</div>

</section>
<script>

for(let i=0;i<100;i++){

let item=document.createElement("div");

item.className="falling";

item.innerHTML=["❤️","🌹","💕","💖"][Math.floor(Math.random()*4)];

item.style.left=Math.random()*100+"vw";

item.style.animationDuration=(Math.random()*6+4)+"s";

document.body.appendChild(item);
const text =
"My dear Anvi ❤️ Thank you for bringing happiness into my life. Every moment with you is special. I promise to love you forever. 🌹";

let i = 0;

function typing() {

if (i < text.length) {

document.getElementById("letter").innerHTML += text.charAt(i);

i++;

setTimeout(typing, 70);

}

}

typing();

function showMessage() {

document.getElementById("surprise").style.display = "block";

}
}

</script>

</body>

</html>
